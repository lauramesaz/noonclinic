<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Capacitación comercial · noon Clinic</title>
<meta name="theme-color" content="#ffffff">
<link rel="icon" href="assets/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,400;1,500&family=Jost:wght@300;400;500&family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,700&display=swap" rel="stylesheet">
<style>
:root { --fondo:#ffffff; --panel:#F7F5F1; --panel2:#EFEBE4; --linea:#ECE6DC; --txt:#28231F; --tenue:#5E554D; --acento:#6D2835; --acento-suave:#F7EFF0; --champagne:#BDA47B;
  --display:"Jost",Futura,sans-serif; --texto:"Nunito Sans","Avenir Next",-apple-system,sans-serif; --r:16px; --lateral:264px; --ease:cubic-bezier(.2,.7,.1,1);
  --sombra:0 1px 2px rgba(40,35,31,.04),0 8px 24px rgba(40,35,31,.06); }
*,*::before,*::after { box-sizing:border-box; }
html { -webkit-text-size-adjust:100%; scroll-padding-top:90px; }
body { margin:0; background:var(--fondo); color:var(--txt); font:400 17px/1.65 var(--texto); -webkit-font-smoothing:antialiased; }
button,input { font:inherit; color:inherit; }
a { color:inherit; text-decoration:none; }
h1,h2,h3 { margin:0; font-family:var(--display); font-weight:400; letter-spacing:-.01em; }
p { margin:0 0 .9em; }
img { display:block; max-width:100%; }
:focus-visible { outline:2px solid var(--acento); outline-offset:2px; border-radius:6px; }
[hidden] { display:none !important; }
svg.i { width:18px; height:18px; fill:none; stroke:currentColor; stroke-width:1.6; stroke-linecap:round; stroke-linejoin:round; flex:none; }

/* ---------- acceso ---------- */
.acceso { min-height:100vh; min-height:100dvh; display:grid; place-items:center; padding:24px 16px; background:var(--panel); }
.acceso form { width:min(400px,100%); background:#fff; border:1px solid var(--linea); border-radius:24px; padding:40px 32px; box-shadow:var(--sombra); display:grid; gap:16px; text-align:center; }
.acceso img { height:30px; width:auto; margin:0 auto 10px; }
.acceso h1 { font-size:26px; }
.acceso p { color:var(--tenue); margin:0; }
.acceso input { width:100%; text-align:center; letter-spacing:.4em; font-size:22px; padding:14px; border:1px solid var(--linea); border-radius:12px; background:var(--panel); outline:none; }
.acceso input:focus { border-color:var(--acento); background:#fff; }
.acceso .error { color:var(--acento); font-size:14px; min-height:1.3em; }
.btn { display:inline-flex; align-items:center; justify-content:center; gap:8px; padding:13px 22px; border-radius:999px; border:1px solid var(--txt); background:var(--txt); color:#fff; font:500 14px var(--texto); cursor:pointer; transition:opacity .2s; }
.btn:hover { opacity:.85; }
.btn.claro { background:#fff; color:var(--txt); border-color:var(--linea); }

/* ---------- estructura ---------- */
.lado { position:fixed; inset:0 auto 0 0; width:var(--lateral); background:var(--panel); border-right:1px solid var(--linea); display:flex; flex-direction:column; padding:22px 16px; overflow-y:auto; z-index:50; transition:transform .4s var(--ease); }
.lado .logo { display:flex; align-items:center; gap:10px; padding:4px 10px 20px; }
.lado .logo img { height:24px; width:auto; }
.lado .logo span { font:500 10px var(--display); letter-spacing:.18em; text-transform:uppercase; color:var(--tenue); border-left:1px solid var(--linea); padding-left:10px; line-height:1.3; }
.nav a, .nav summary { display:flex; align-items:center; gap:12px; padding:10px 12px; border-radius:10px; font-weight:600; font-size:14.5px; cursor:pointer; list-style:none; transition:background .2s; }
.nav summary::-webkit-details-marker { display:none; }
.nav a:hover, .nav summary:hover { background:var(--panel2); }
.nav a.activo { background:#fff; color:var(--acento); box-shadow:var(--sombra); }
.nav summary .flecha { margin-left:auto; transition:transform .25s; }
.nav details[open] summary .flecha { transform:rotate(90deg); }
.nav .sub a { font-weight:400; padding:7px 12px 7px 42px; color:var(--tenue); font-size:14px; }
.nav .sub a:hover, .nav .sub a.activo { color:var(--acento); background:transparent; box-shadow:none; }
.nav .titulo-nav { font:500 10.5px var(--display); letter-spacing:.18em; text-transform:uppercase; color:var(--tenue); padding:18px 12px 6px; }
.lado .salir { margin-top:auto; display:flex; align-items:center; gap:10px; padding:10px 12px; border:0; background:none; color:var(--tenue); cursor:pointer; border-radius:10px; }
.lado .salir:hover { background:var(--panel2); }
.velo { position:fixed; inset:0; background:rgba(40,35,31,.35); z-index:45; opacity:0; pointer-events:none; transition:opacity .3s; }

.principal { margin-left:var(--lateral); min-height:100vh; }
.barra { position:sticky; top:0; z-index:40; display:flex; align-items:center; gap:12px; padding:14px clamp(16px,3vw,36px); background:rgba(255,255,255,.92); backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px); border-bottom:1px solid var(--linea); }
.hamb { display:none; width:42px; height:42px; border-radius:12px; border:1px solid var(--linea); background:#fff; cursor:pointer; align-items:center; justify-content:center; flex:none; }
.buscador { position:relative; flex:1; max-width:640px; }
.buscador label { display:flex; align-items:center; gap:10px; background:var(--panel); border:1px solid var(--linea); border-radius:12px; padding:0 14px; transition:border-color .2s,background .2s; }
.buscador label:focus-within { background:#fff; border-color:var(--acento); }
.buscador input { flex:1; border:0; background:transparent; outline:none; padding:11px 0; font-size:15px; min-width:0; }
.buscador kbd { font:500 11px var(--texto); color:var(--tenue); border:1px solid var(--linea); border-radius:6px; padding:2px 6px; background:#fff; }
.resultados { position:absolute; top:calc(100% + 8px); left:0; right:0; background:#fff; border:1px solid var(--linea); border-radius:var(--r); box-shadow:0 18px 50px rgba(40,35,31,.14); max-height:min(70vh,520px); overflow-y:auto; padding:8px; }
.res { display:flex; gap:12px; align-items:center; padding:9px 10px; border-radius:10px; }
.res:hover, .res.sel { background:var(--panel); }
.res img { width:46px; height:46px; border-radius:10px; object-fit:cover; flex:none; }
.res b { display:block; font-weight:600; font-size:14.5px; }
.res small { display:block; color:var(--tenue); font-size:13px; line-height:1.4; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
.res mark { background:var(--acento-suave); color:var(--acento); border-radius:3px; padding:0 2px; }
.res .tag { margin-left:auto; flex:none; font-size:11.5px; color:var(--tenue); background:var(--panel); border-radius:999px; padding:3px 9px; }
.sin-res { padding:16px; color:var(--tenue); }
.barra .disp { margin-left:auto; display:flex; align-items:center; gap:8px; font-weight:600; font-size:14px; padding:10px 14px; border-radius:12px; border:1px solid var(--linea); white-space:nowrap; }
.barra .disp:hover { background:var(--panel); }

.vista { padding:clamp(22px,3.5vw,44px) clamp(16px,3vw,36px) 80px; max-width:1180px; }
.migas { display:flex; flex-wrap:wrap; align-items:center; gap:6px; color:var(--tenue); font-size:13.5px; margin-bottom:16px; }
.migas a:hover { color:var(--acento); }
.cabeza h1 { font-size:clamp(28px,4vw,40px); line-height:1.15; }
.cabeza p { color:var(--tenue); max-width:640px; margin-top:8px; font-size:16px; }

/* ---------- inicio ---------- */
.portada { background:var(--panel); border-radius:24px; padding:clamp(26px,4vw,48px); display:grid; grid-template-columns:1.3fr 1fr; gap:28px; align-items:center; margin-bottom:34px; }
.portada h1 { font-size:clamp(28px,4vw,42px); line-height:1.12; }
.portada .chips { margin-top:18px; }
.chips { display:flex; flex-wrap:wrap; gap:8px; }
.chip { padding:8px 14px; border-radius:999px; border:1px solid var(--linea); background:#fff; font-size:13.5px; font-weight:600; cursor:pointer; transition:border-color .2s,color .2s; }
.chip:hover { border-color:var(--acento); color:var(--acento); }
.chip.on { background:var(--txt); color:#fff; border-color:var(--txt); }
.regla-oro { background:#fff; border-radius:var(--r); padding:22px; border:1px solid var(--linea); }
.regla-oro .eti, .guion .eti { display:inline-flex; align-items:center; gap:8px; font:500 11px var(--display); letter-spacing:.14em; text-transform:uppercase; color:var(--acento); margin-bottom:10px; }
.regla-oro p { margin:0; font-size:15px; }
.seccion { margin:0 0 40px; }
.seccion-cab { display:flex; align-items:end; justify-content:space-between; gap:16px; margin-bottom:16px; }
.seccion-cab h2 { font-size:24px; }
.seccion-cab a { color:var(--acento); font-weight:600; font-size:14px; white-space:nowrap; }
.atajos { display:grid; grid-template-columns:repeat(3,1fr); gap:14px; margin-bottom:40px; }
.atajo { display:flex; gap:14px; align-items:flex-start; padding:18px; border:1px solid var(--linea); border-radius:var(--r); transition:box-shadow .25s,border-color .25s; }
.atajo:hover { box-shadow:var(--sombra); border-color:transparent; }
.atajo .ico { width:40px; height:40px; border-radius:12px; background:var(--acento-suave); color:var(--acento); display:grid; place-items:center; flex:none; }
.atajo b { display:block; font-weight:600; }
.atajo span { color:var(--tenue); font-size:14px; }

/* ---------- tarjetas ---------- */
.rejilla { display:grid; grid-template-columns:repeat(auto-fill,minmax(230px,1fr)); gap:18px; }
.tarjeta { display:flex; flex-direction:column; border-radius:var(--r); overflow:hidden; background:#fff; border:1px solid var(--linea); transition:box-shadow .3s var(--ease),transform .3s var(--ease); }
.tarjeta:hover { box-shadow:0 14px 36px rgba(40,35,31,.1); transform:translateY(-2px); }
.tarjeta .foto { aspect-ratio:4/3; background:var(--panel2) center/cover; }
.tarjeta .info { padding:14px 16px 16px; }
.tarjeta .cat { font-size:12px; color:var(--tenue); font-weight:600; }
.tarjeta h3 { font-size:18px; margin:3px 0 4px; line-height:1.25; }
.tarjeta p { color:var(--tenue); font-size:14.5px; line-height:1.5; margin:0; }
.filtros { margin:20px 0 22px; }

/* ---------- ficha ---------- */
.ficha-top { display:grid; grid-template-columns:1.1fr 1fr; gap:28px; align-items:center; margin-bottom:30px; }
.ficha-top .foto { aspect-ratio:4/3; border-radius:22px; background:var(--panel2) center/cover; }
.ficha-top h1 { font-size:clamp(30px,4.2vw,44px); line-height:1.1; margin:6px 0 10px; }
.ficha-top .corto { color:var(--tenue); font-size:17px; }
.etq { display:inline-flex; align-items:center; gap:6px; font-size:12.5px; font-weight:600; color:var(--tenue); background:var(--panel); border-radius:999px; padding:5px 11px; }
.doctor { display:flex; align-items:center; gap:10px; margin-top:16px; padding:10px 14px 10px 10px; border:1px solid var(--linea); border-radius:999px; width:max-content; max-width:100%; }
.doctor img { width:34px; height:34px; border-radius:50%; object-fit:cover; }
.doctor b { font-weight:600; font-size:14px; display:block; line-height:1.2; }
.doctor small { color:var(--tenue); font-size:12.5px; }
.datos { display:grid; grid-template-columns:repeat(4,1fr); gap:12px; margin-bottom:30px; }
.dato { background:var(--panel); border-radius:14px; padding:14px 16px; }
.dato small { display:block; font-size:13px; color:var(--tenue); font-weight:600; margin-bottom:4px; }
.dato b { font-weight:700; font-size:16px; line-height:1.35; display:block; }
.cuerpo { display:grid; grid-template-columns:minmax(0,1fr) 360px; gap:36px; align-items:start; }
.indice { display:flex; gap:6px; flex-wrap:wrap; margin-bottom:26px; padding-bottom:16px; border-bottom:1px solid var(--linea); }
.indice a { font-size:13.5px; font-weight:600; color:var(--tenue); padding:6px 12px; border-radius:999px; background:var(--panel); }
.indice a:hover { color:var(--acento); }
.bloque { margin-bottom:34px; }
.bloque h2 { font-size:24px; margin-bottom:12px; }
.lista { list-style:none; padding:0; margin:0; display:grid; gap:8px; }
.lista li { display:flex; gap:10px; align-items:flex-start; }
.lista li svg { color:var(--acento); margin-top:3px; }
.tiempo { display:grid; gap:0; }
.paso { display:grid; grid-template-columns:22px 1fr; gap:12px; position:relative; padding-bottom:16px; }
.paso::before { content:""; position:absolute; left:6px; top:16px; bottom:0; width:1px; background:var(--linea); }
.paso:last-child::before { display:none; }
.paso i { width:13px; height:13px; border-radius:50%; border:2px solid var(--acento); background:#fff; margin-top:5px; }
.paso b { font-weight:600; display:block; }
.paso span { color:var(--tenue); font-size:16px; }
.faq { border:1px solid var(--linea); border-radius:var(--r); overflow:hidden; }
.faq details + details { border-top:1px solid var(--linea); }
.faq summary { list-style:none; cursor:pointer; display:flex; gap:12px; align-items:center; padding:17px 20px; font-weight:700; font-size:17px; }
.faq summary::-webkit-details-marker { display:none; }
.faq summary::after { content:""; margin-left:auto; width:9px; height:9px; border-right:1.6px solid var(--tenue); border-bottom:1.6px solid var(--tenue); transform:rotate(45deg); transition:transform .25s; flex:none; }
.faq details[open] summary::after { transform:rotate(-135deg); }
.faq details[open] { background:var(--panel); }
.faq .resp { padding:0 20px 18px; color:var(--txt); font-size:17px; }
.faq details.precio summary { color:var(--acento); }
.copiar { display:inline-flex; align-items:center; gap:6px; border:1px solid var(--linea); background:#fff; border-radius:999px; padding:6px 12px; font-size:12.5px; font-weight:600; cursor:pointer; color:var(--txt); }
.copiar:hover { border-color:var(--acento); color:var(--acento); }
.lateral-ficha { position:sticky; top:90px; display:grid; gap:14px; }
.guion { background:var(--acento-suave); border-radius:var(--r); padding:20px; }
.guion p { font-size:17px; line-height:1.55; color:#2f2023; font-weight:600; }
.guion.neutro { background:var(--panel); }
.guion.neutro .eti { color:var(--txt); }
.relacionados h3 { font-size:15px; font-family:var(--texto); font-weight:700; margin-bottom:10px; }
.mini { display:flex; gap:10px; align-items:center; padding:7px; border-radius:12px; }
.mini:hover { background:var(--panel); }
.mini img { width:44px; height:44px; border-radius:10px; object-fit:cover; }
.mini b { font-weight:600; font-size:14px; }

/* ---------- objeciones / disponibilidad ---------- */
.dos { display:grid; grid-template-columns:1fr 1fr; gap:18px; }
.doc-card { border:1px solid var(--linea); border-radius:20px; padding:22px; }
.doc-card .quien { display:flex; gap:14px; align-items:center; margin-bottom:16px; }
.doc-card img { width:64px; height:64px; border-radius:50%; object-fit:cover; }
.doc-card h2 { font-size:21px; }
.doc-card .area { color:var(--acento); font-weight:600; font-size:14px; }
.dia { display:flex; justify-content:space-between; gap:12px; padding:11px 2px; border-top:1px solid var(--linea); font-size:14.5px; }
.dia span:first-child { font-weight:600; }
.dia .pend { color:var(--tenue); background:var(--panel); border-radius:999px; padding:1px 10px; font-size:13px; }
.nota { color:var(--tenue); font-size:14px; margin-top:20px; }
.reglas { display:grid; grid-template-columns:1fr 1fr; gap:14px; }
.regla { background:var(--panel); border-radius:var(--r); padding:18px; }
.regla b { display:block; font-weight:700; margin-bottom:4px; }
.regla span { color:var(--tenue); font-size:16px; }

.precio-card { border:1.5px solid var(--acento); border-radius:20px; padding:20px 22px; margin-bottom:30px; display:grid; grid-template-columns:1fr; gap:4px; max-width:680px; }
.precio-card.sin { border:1.5px dashed var(--linea); background:var(--panel); display:block; }
.precio-card .eti { grid-column:1/-1; font:500 11.5px var(--display); letter-spacing:.14em; text-transform:uppercase; color:var(--acento); }
.precio-fila { display:flex; justify-content:space-between; align-items:baseline; gap:14px; padding:8px 0; border-bottom:1px solid var(--linea); }
.precio-fila span { font-weight:600; }
.precio-fila b { font:500 22px var(--display); color:var(--acento); white-space:nowrap; }
.precio-card .incl { grid-column:1/-1; display:flex; flex-wrap:wrap; gap:8px; margin-top:6px; }
.precio-card .incl span { font-size:14px; background:var(--acento-suave); color:#4a2a31; border-radius:999px; padding:5px 12px; font-weight:600; }
.precio-card.sin p { margin:0; font-size:17px; font-weight:600; }
.badge { position:absolute; top:12px; left:12px; background:var(--acento); color:#fff; font-weight:700; font-size:14px; border-radius:999px; padding:6px 13px; box-shadow:0 4px 14px rgba(109,40,53,.3); }
.tarjeta.con-precio { border:2px solid var(--acento); }
.tarjeta.con-precio .info { background:var(--acento-suave); flex:1; }
.tarjeta .valor { display:block; font:500 21px var(--display); color:var(--acento); margin-top:6px; }
.destacados { background:linear-gradient(180deg,var(--acento-suave),#fff); border-radius:24px; padding:clamp(18px,3vw,30px); margin-bottom:40px; }
.destacados .seccion-cab h2 { color:var(--acento); }
.destacados .seccion-cab p { margin:4px 0 0; color:var(--tenue); font-size:15px; }
.tarjeta { position:relative; }
.tabla-precios { border:1px solid var(--linea); border-radius:var(--r); overflow:hidden; }
.tabla-precios a, .tabla-precios div { display:grid; grid-template-columns:1fr auto; gap:14px; padding:15px 20px; align-items:center; }
.tabla-precios > * + * { border-top:1px solid var(--linea); }
.tabla-precios a:hover { background:var(--panel); }
.tabla-precios small { display:block; color:var(--tenue); font-size:13.5px; }
.tabla-precios b { font:500 20px var(--display); color:var(--acento); white-space:nowrap; }
.video { position:relative; border-radius:24px; overflow:hidden; background:#000; aspect-ratio:16/9; margin-bottom:14px; box-shadow:0 18px 50px rgba(40,35,31,.14); }
.video iframe { position:absolute; inset:0; width:100%; height:100%; border:0; }
.video .play { position:absolute; inset:0; width:100%; border:0; padding:0; cursor:pointer; background:center/cover; display:grid; place-items:center; }
.video .play::before { content:""; position:absolute; inset:0; background:linear-gradient(180deg,rgba(40,35,31,0) 40%,rgba(40,35,31,.7)); }
.video .boton-play { position:relative; width:84px; height:84px; border-radius:50%; background:var(--acento); display:grid; place-items:center; box-shadow:0 10px 30px rgba(109,40,53,.45); transition:transform .3s var(--ease); }
.video .play:hover .boton-play { transform:scale(1.08); }
.video .boton-play::after { content:""; margin-left:6px; border-left:24px solid #fff; border-top:15px solid transparent; border-bottom:15px solid transparent; }
.video .pie-video { position:absolute; left:24px; right:24px; bottom:20px; text-align:left; color:#fff; }
.video .pie-video small { font:500 11px var(--display); letter-spacing:.16em; text-transform:uppercase; opacity:.85; }
.video .pie-video b { display:block; font:400 clamp(20px,3vw,30px)/1.2 var(--display); }
.video-nota { color:var(--tenue); font-size:14px; margin:0 0 34px; }
.aviso { position:fixed; left:50%; bottom:24px; transform:translate(-50%,16px); opacity:0; background:var(--txt); color:#fff; padding:10px 18px; border-radius:999px; font-size:14px; font-weight:600; transition:.3s var(--ease); pointer-events:none; z-index:70; }
.aviso.ver { opacity:1; transform:translate(-50%,0); }

/* ---------- el camino del paciente ---------- */
:root { --espresso:#28231F; --ivory:#F2EFE8; --bone:#D8D0C3; --taupe:#A69A8B; --serif:"Cormorant Garamond",Georgia,serif; }
.cam-hero { position:relative; overflow:hidden; background:var(--espresso); color:var(--ivory); border-radius:28px; padding:clamp(28px,5vw,56px); margin-bottom:28px; isolation:isolate; }
.cam-hero::before { content:""; position:absolute; inset:-40%; z-index:-1; background:radial-gradient(40% 35% at 75% 30%,rgba(109,40,53,.75),transparent 70%),radial-gradient(35% 30% at 20% 80%,rgba(189,164,123,.28),transparent 70%); animation:deriva 14s ease-in-out infinite alternate; }
@keyframes deriva { to { transform:translate(-6%,4%) rotate(8deg); } }
.cam-hero .eti { font:500 11px var(--display); letter-spacing:.2em; text-transform:uppercase; color:var(--champagne); }
.cam-hero h1 { font:300 clamp(36px,6vw,64px)/1.02 var(--display); margin:12px 0 14px; letter-spacing:-.02em; }
.cam-hero h1 em { font:italic 500 1.12em var(--serif); color:#e7c9cf; }
.cam-hero p { color:var(--bone); max-width:520px; font-size:18px; margin:0; }
.cam-hero .stats { display:flex; flex-wrap:wrap; gap:10px 26px; margin-top:26px; }
.cam-hero .stats div { display:flex; flex-direction:column; }
.cam-hero .stats b { font:300 34px/1 var(--display); color:#fff; }
.cam-hero .stats small { color:var(--taupe); font-size:13px; }

.pista { position:relative; margin:6px 0 22px; padding:52px 4px 0; }

.ficha-pac { position:absolute; top:0; left:0; width:44px; display:flex; justify-content:center; transition:transform .7s var(--ease); pointer-events:none; }

.escena { display:grid; grid-template-columns:minmax(0,1.15fr) minmax(0,1fr); gap:22px; align-items:stretch; margin-bottom:14px; }

.escena-info { isolation:isolate; }
.quien-chip { display:inline-flex; align-items:center; gap:10px; align-self:flex-start; background:var(--panel); border-radius:999px; padding:6px 14px 6px 6px; font-weight:700; font-size:13.5px; }

.quien-chip .av svg { width:16px; height:16px; }
.escena-info h2 { font:400 clamp(26px,3.2vw,36px)/1.15 var(--display); }
.escena-info .como { color:var(--tenue); font-size:17px; margin:0; }
.alerta { display:flex; gap:12px; align-items:flex-start; background:#FBF6EC; border:1px solid #EADFC8; border-radius:16px; padding:13px 16px; font-weight:600; color:#5b4524; }
.alerta .ojo { flex:none; font:500 10.5px var(--display); letter-spacing:.16em; text-transform:uppercase; background:var(--champagne); color:#fff; border-radius:999px; padding:4px 9px; margin-top:2px; }
.controles { display:flex; gap:10px; margin-top:auto; padding-top:8px; }

.anima > * { animation:entra .55s var(--ease) both; }
.anima > *:nth-child(2){animation-delay:.05s}.anima > *:nth-child(3){animation-delay:.1s}.anima > *:nth-child(4){animation-delay:.15s}.anima > *:nth-child(5){animation-delay:.2s}.anima > *:nth-child(6){animation-delay:.25s}
@keyframes entra { from { opacity:0; transform:translateY(14px); } }

.telefono { background:#EFE9DF; border-radius:28px; padding:16px; display:flex; flex-direction:column; min-height:300px; position:relative; overflow:hidden;
  background-image:radial-gradient(rgba(40,35,31,.05) 1px,transparent 1px); background-size:14px 14px; }

.escribiendo { align-self:flex-start; background:#fff; border-radius:16px; padding:12px 14px; display:flex; gap:4px; animation:burb .3s forwards; opacity:0; }

.cam-titulo { display:flex; align-items:baseline; gap:12px; margin:0 0 16px; }

.tres { display:grid; grid-template-columns:repeat(3,1fr); gap:14px; margin-bottom:48px; }

.preg:hover { transform:translateY(-4px) rotate(-.6deg); box-shadow:var(--sombra); }

.carta .in { position:relative; display:block; height:100%; transition:transform .6s var(--ease); transform-style:preserve-3d; }

.carta .frente { background:#fff; border:1px solid var(--linea); }

.quiz { background:var(--espresso); color:var(--ivory); border-radius:28px; padding:clamp(24px,4vw,44px); margin-bottom:30px; position:relative; overflow:hidden; }

.quiz .barra-q i.ok { background:var(--champagne); } .quiz .barra-q i.mal { background:#b45a6a; } .quiz .barra-q i.ya { background:var(--ivory); }
.quiz .sit { font:300 clamp(24px,3vw,32px)/1.25 var(--display); margin:6px 0 22px; max-width:720px; }
.quiz .eti { font:500 11px var(--display); letter-spacing:.2em; text-transform:uppercase; color:var(--champagne); }
.opciones { display:grid; gap:10px; max-width:640px; }
.opcion { text-align:left; background:rgba(242,239,232,.07); border:1px solid rgba(242,239,232,.18); color:var(--ivory); border-radius:16px; padding:15px 18px; font-weight:600; font-size:16px; cursor:pointer; transition:all .25s var(--ease); display:flex; align-items:center; gap:12px; }
.opcion:hover:not([disabled]) { background:rgba(242,239,232,.14); transform:translateX(4px); }

.opcion.mal { background:#7a2f3d; border-color:#b45a6a; animation:sacude .4s; }
.opcion[disabled] { cursor:default; }
@keyframes sacude { 25%{transform:translateX(-6px)} 75%{transform:translateX(6px)} }
.explica { margin-top:18px; max-width:640px; background:rgba(242,239,232,.08); border-radius:16px; padding:14px 18px; display:flex; gap:12px; align-items:center; justify-content:space-between; flex-wrap:wrap; animation:entra .4s var(--ease) both; }

.final { text-align:left; }
.final .score { font:300 clamp(64px,10vw,110px)/1 var(--display); color:#fff; }
.final .score small { font-size:.35em; color:var(--taupe); }
.final h3 { font:italic 500 clamp(28px,4vw,40px) var(--serif); color:#e7c9cf; margin:6px 0 10px; }
.confeti { position:fixed; inset:0; pointer-events:none; z-index:80; overflow:hidden; }
.confeti i { position:absolute; top:-12px; width:9px; height:14px; border-radius:2px; animation:cae linear forwards; }
@keyframes cae { to { transform:translate3d(var(--x),105vh,0) rotate(var(--r)); } }
.banner-camino { display:flex; align-items:center; gap:18px; background:var(--espresso); color:var(--ivory); border-radius:22px; padding:20px 24px; margin-bottom:28px; position:relative; overflow:hidden; isolation:isolate; transition:transform .3s var(--ease); }
.banner-camino::before { content:""; position:absolute; inset:0; z-index:-1; background:radial-gradient(50% 120% at 90% 50%,rgba(109,40,53,.8),transparent 70%); }
.banner-camino:hover { transform:translateY(-2px); }

@media (max-width:900px) { .escena, .confirma { grid-template-columns:1fr; } .tres, .oro { grid-template-columns:1fr; } .carta { height:120px; } }
@media (max-width:640px) {
  .pista { padding-top:44px; } .pista .riel { top:59px; left:15px; right:15px; }
  .parada, .ficha-pac { width:30px; } .parada .bola { width:30px; height:30px; } .parada .bola svg { width:14px; height:14px; }
  .parada span { display:none; } .parada.on .bola { transform:scale(1.25); } .ficha-pac b { font-size:10.5px; padding:3px 8px; }
  .escena-info .num { font-size:100px; }
}
@media (prefers-reduced-motion:reduce) { .cam-hero::before, .ficha-pac b, .anima > *, .burb { animation:none !important; opacity:1; transform:none; } }

/* ---------- camino: más contraste (sobre el primer diseño) ---------- */
:root { --tinta:#16110F; --vinoF:#7A1F33; --rosa:#F2B8C4; --gris:#3E3631; }
.cam-hero { background:var(--tinta); }
.cam-hero::before { background:radial-gradient(40% 40% at 78% 28%,rgba(122,31,51,.95),transparent 70%),radial-gradient(30% 30% at 15% 85%,rgba(189,164,123,.35),transparent 70%); }
.cam-hero h1 { color:#fff; font-weight:400; }
.cam-hero h1 em { color:var(--rosa); }
.cam-hero p { color:#E6DFD5; }
.cam-hero .stats b { font-weight:400; }
.cam-hero .stats small { color:#CFC6BA; }

.pista .riel { height:4px; background:#DCD3C7; top:72px; }
.pista .riel i { background:var(--vinoF); }
.parada { color:var(--tinta); }
.parada .bola { border:2px solid var(--tinta); color:var(--tinta); }
.parada.hecha .bola { background:var(--tinta); border-color:var(--tinta); color:var(--champagne); }
.parada.on .bola { background:var(--vinoF); border-color:var(--vinoF); color:#fff; box-shadow:0 8px 22px rgba(122,31,51,.4); }
.parada.on span { color:var(--vinoF); }
.ficha-pac b { background:var(--vinoF); } .ficha-pac b::after { border-top-color:var(--vinoF); }

.escena-info { border:2px solid var(--tinta); }
.escena-info .num { color:#F3E6E9; font-weight:400; }
.quien-chip { background:var(--tinta); color:#fff; }
.quien-chip .av { background-color:var(--vinoF); color:#fff; }
.escena-info h2 { color:var(--tinta); }
.escena-info .como { color:var(--gris); }
.alerta { background:var(--tinta); border:0; color:#fff; align-items:center; }
.alerta .ojo { background:var(--champagne); color:var(--tinta); font-weight:600; margin-top:0; }
.controles .btn { background:var(--vinoF); border-color:var(--vinoF); }
.controles .btn.claro { background:#fff; color:var(--tinta); border:2px solid var(--tinta); }

.telefono { border:2px solid var(--tinta); }
.telefono .top { background:var(--tinta); }
.telefono .top small { color:var(--champagne); }
.burb.noon { background:var(--vinoF); color:#fff; } .burb.noon small { color:var(--rosa); opacity:1; }
.burb.int { background:var(--champagne); color:var(--tinta); }
.escribiendo i { background:var(--vinoF); }
.pista-teclas { color:var(--gris); }

.cam-titulo h2 { color:var(--tinta); font-weight:400; }
.cam-titulo h2 em { color:var(--vinoF); }
.cam-titulo span { color:var(--gris); }
.preg { background:#fff; border:2px solid var(--tinta); }
.preg:nth-child(2) { background:var(--vinoF); border-color:var(--vinoF); color:#fff; }
.preg:nth-child(2) .n { color:var(--rosa); } .preg:nth-child(2) span { color:#F4E6E8; } .preg:nth-child(2) .opc i { background:rgba(255,255,255,.16); color:#fff; }
.preg .n { color:var(--vinoF); }
.preg span { color:var(--gris); }
.preg .opc i { background:var(--tinta); color:#fff; }
.confirma li svg { color:var(--vinoF); }
.confirma .copiar { background:var(--vinoF); border-color:var(--vinoF); color:#fff; padding:10px 18px; font-size:14px; }
.carta .frente { border:2px solid var(--tinta); }
.carta:nth-child(odd) .frente { background:var(--tinta); color:#fff; } .carta:nth-child(odd) .frente small { color:var(--rosa); }
.carta .frente small { color:var(--vinoF); }
.carta .reves { background:var(--vinoF); }
.quiz { background:var(--tinta); }
.opcion { background:#fff; color:var(--tinta); border:0; }
.opcion:hover:not([disabled]) { background:var(--rosa); }
.opcion .l { background:var(--tinta); color:#fff; border:0; }
.opcion.ok { background:var(--champagne); border:0; color:var(--tinta); } .opcion.ok .l { background:var(--tinta); }
.opcion.mal { background:var(--vinoF); color:#fff; border:0; } .opcion.mal .l { background:#fff; color:var(--vinoF); }
.opcion[disabled]:not(.ok):not(.mal) { opacity:.5; }
.quiz .barra-q i { height:5px; } .quiz .barra-q i.mal { background:var(--vinoF); }
.explica { background:rgba(255,255,255,.1); }
.banner-camino { background:var(--tinta); } .banner-camino b em { color:var(--rosa); }

/* ---------- camino: líneas suaves + que se note que se toca ---------- */
.pista .riel { background:#ECE6DC; height:3px; }
.parada .bola { border:1.5px solid #D8D0C3; color:#5E554D; box-shadow:0 2px 8px rgba(40,35,31,.06); }
.parada span { color:#5E554D; }
.parada:hover .bola { border-color:var(--vinoF); color:var(--vinoF); background:#FBEFF1; transform:translateY(-3px); box-shadow:0 8px 18px rgba(122,31,51,.18); }
.parada.hecha .bola { background:var(--tinta); border-color:var(--tinta); color:var(--champagne); box-shadow:none; }
.parada.hecha span { color:var(--tinta); }
.parada.sig .bola { border-color:var(--vinoF); color:var(--vinoF); background:#fff; animation:llama 1.6s ease-out infinite; }
.parada.sig span { color:var(--vinoF); }
@keyframes llama { 0% { box-shadow:0 0 0 0 rgba(122,31,51,.45); } 70% { box-shadow:0 0 0 14px rgba(122,31,51,0); } 100% { box-shadow:0 0 0 0 rgba(122,31,51,0); } }
.toca { display:flex; align-items:center; gap:8px; font-weight:700; font-size:14px; color:var(--vinoF); margin:2px 0 0; }
.toca i { font-style:normal; display:inline-block; animation:empuja 1.2s ease-in-out infinite; }
@keyframes empuja { 50% { transform:translateX(5px); } }
.escena-info { border:1px solid var(--linea); box-shadow:0 10px 30px rgba(40,35,31,.07); }
.telefono { border:0; }
.controles .btn.claro { border:1px solid #D8D0C3; }
.preg { border:1px solid #D8D0C3; }
.carta .frente { border:1px solid #D8D0C3; }
.carta:nth-child(odd) .frente { border-color:var(--tinta); }
@media (prefers-reduced-motion:reduce) { .parada.sig .bola, .toca i { animation:none; } }

/* ---------- camino: leyendas de los recuadros ---------- */
.escena .col { display:flex; flex-direction:column; gap:10px; min-width:0; }
.escena .col > .escena-info, .escena .col > .telefono { flex:1; }
.leyenda { display:inline-flex; align-items:center; gap:8px; font:500 11.5px var(--display); letter-spacing:.14em; text-transform:uppercase; color:#5E554D; padding-left:4px; }
.leyenda svg { width:15px; height:15px; color:var(--vinoF); }
.leyenda em { font-style:normal; letter-spacing:.04em; text-transform:none; color:#A69A8B; font-family:var(--texto); font-size:12.5px; }

/* ---------- camino: verde = bien, rojo = mal (solo eso; el resto sigue vino/negro) ---------- */
.camino-v { --bien:#12805A; --bienS:#E4F4EC; --bienC:#7FDDB1; --mal:#D63A3A; --malS:#FDECEC; --malC:#FF9C9C; }
.camino-v .alerta { background:var(--malS); color:#8E1F1F; border:1px solid #F5C2C2; }
.camino-v .alerta .ojo { background:var(--mal); color:#fff; }
.camino-v .confirma li svg { color:var(--bien); }
.camino-v .opcion.ok { background:var(--bien); color:#fff; } .camino-v .opcion.ok .l { background:#fff; color:var(--bien); }
.camino-v .opcion.mal { background:var(--mal); color:#fff; } .camino-v .opcion.mal .l { background:#fff; color:var(--mal); }
.camino-v .quiz .barra-q i.ok { background:var(--bienC); } .camino-v .quiz .barra-q i.mal { background:var(--malC); }
.camino-v .explica.si p b { color:var(--bienC); } .camino-v .explica.no p b { color:var(--malC); }

@media (max-width:1080px) { .cuerpo { grid-template-columns:1fr; } .lateral-ficha { position:static; } .datos { grid-template-columns:1fr 1fr; } }
@media (max-width:900px) {
  .precio-card { grid-template-columns:1fr; }
  .lado { transform:translateX(-100%); box-shadow:0 0 40px rgba(0,0,0,.15); }
  .abierto .lado { transform:none; }
  .abierto .velo { opacity:1; pointer-events:auto; }
  .principal { margin-left:0; }
  .hamb { display:inline-flex; }
  .barra .disp span, .buscador kbd { display:none; }
  .portada, .ficha-top { grid-template-columns:1fr; }
  .atajos { grid-template-columns:1fr; }
  .dos, .reglas { grid-template-columns:1fr; }

nizamos las fechas para que todo quede en un mismo viaje. ¿En qué fechas podrías venir?"], ["“¿Me puedo operar ya?”", "Primero va tu valoración y tus exámenes; desde ahí te damos la fecha más cercana. ¿Te agendo la valoración esta semana?"]], "reglas": [["Vende la valoración", "Tu meta es que el paciente agende su cita de valoración."], ["Precio solo si lo tenemos", "Si el procedimiento tiene precio, dalo. Si no, el valor se define en la valoración."], ["Mensajes cortos", "Dos o tres líneas máximo. Nada de párrafos largos."], ["Termina siempre en pregunta", "Ejemplo: “¿Te queda mejor el martes o el jueves?”."]], "pasos": [["Saluda", "Pregunta su nombre y qué le gustaría mejorar."], ["Explica corto", "En dos líneas, qué es el procedimiento."], ["Responde", "Usa las respuestas de cada procedimiento."], ["Agenda", "Ofrece dos fechas de la pestaña Disponibilidad."]], "precio": "El valor se define en tu cita de valoración con {doc}, porque cada plan es personal. ¿Te agendo esta semana?", "lista_precios": [["Mamoplastia de aumento", "Mamoplastia de aumento (paquete)", "$10.900.000", "mamoplastia-de-aumento", "cx"], ["Mastopexia con implantes", "Mastopexia con implantes", "Desde $17.900.000", "mastopexia-con-implantes", "cx"], ["Mastopexia sin implantes", "Mastopexia sin implantes", "Desde $15.900.000", "mastopexia-sin-implantes", "cx"], ["Lipotransferencia glútea", "Lipotransferencia", "Desde $18.900.000", "lipotransferencia-glutea", "cx"], ["Toxina botulínica", "Toxina botulínica", "$999.000", "toxina-botulinica", "me"], ["Ácido hialurónico", "Ácido hialurónico en labios", "$990.000", "acido-hialuronico", "me"], ["Bioestimuladores de colágeno", "Sculptra", "$1.830.000", "bioestimuladores", "me"], ["Bioestimuladores de colágeno", "Radiesse", "$1.830.000", "bioestimuladores", "me"], ["Skinboosters", "Mesoterapia facial NCTF", "$810.000", "skinboosters", "me"], ["Skinboosters", "Mesoterapia de ojeras NCTF", "$540.000", "skinboosters", "me"], ["Peelings químicos", "Peeling S });

function irA(i, primera) {
  const C = D.camino; pasoC = Math.max(0, Math.min(C.length - 1, i)); const p = C[pasoC];
  $$(".parada").forEach((b, j) => { b.classList.toggle("on", j === pasoC); b.classList.toggle("hecha", j < pasoC); b.classList.toggle("sig", j === pasoC + 1); });
  const tc = $("#toca"); if (tc) tc.innerHTML = pasoC === C.length - 1 ? "¡Llegaste al final! Toca cualquier círculo para repasar." : `Toca el siguiente círculo para avanzar <i>→</i>`;
  const pista = $("#pista"), bolas = $$(".parada"); if (!pista || !bolas.length) return;
  const x = bolas[pasoC].offsetLeft; $("#token").style.transform = `translateX(${x}px)`;
  $("#riel").style.width = (pasoC / (C.length - 1) * 100) + "%";

  $("#escena").innerHTML = `<div class="col"><span class="leyenda">${ico("lista")}Qué pasa en este paso</span><div class="escena-info anima"><span class="num">${String(pasoC + 1).padStart(2, "0")}</span>
      <span class="quien-chip">${av}${esc(p.quien)}</span><h2>${esc(p.que)}</h2><p class="como">${esc(p.como)}</p>
      ${p.ojo ? `<div class="alerta"><span class="ojo">Ojo</span><span>${esc(p.ojo)}</span></div>` : ""}
      <div class="controles"><button class="btn claro" type="button" data-mover="-1" ${pasoC === 0 ? "disabled" : ""}>← Atrás</button>
        <button class="btn" type="button" data-mover="1" ${pasoC === C.length - 1 ? "disabled" : ""}>${pasoC === C.length - 2 ? "¡Último paso!" : "Siguiente"} →</button></div></div>
    </div><div class="col"><span class="leyenda">${ico("chat")}Así se ve en el chat <em>(ejemplo)</em></span><div class="telefono"><div class="top"><img src="assets/logo-noon-claro.png" alt="noon"><small>${esc(p.quien.split("·")[0])}</small></div><div class="burbujas" id="burbujas"></div></div></div>`;
  chatea(p.chat);
  if (pasoC === C.length - 1 && !primera) confeti();
}
let chatT = [];
function chatea(msgs) {
  chatT.forEach(clearTimeout); chatT = []; const caja = $("#burbujas");
  if (!msgs.length) { caja.innerHTML = `<div class="vacio"><b>En persona</b>Aquí no hay chat: es la consulta con el doctor.</div>`; caja.style.margin = "auto"; return; }

    chatT.push(setTimeout(() => { caja.insertAdjacentHTML("beforeend", `<div class="escribiendo ${lado === "noon" ? "der" : ""}"><i></i><i></i><i></i></div>`); const e = caja.lastElementChild; if (lado === "noon") e.style.alignSelf = "flex-end"; if (lado === "int") e.style.alignSelf = "center"; }, t));
    t += 700;
    chatT.push(setTimeout(() => { caja.querySelector(".escribiendo")?.remove(); caja.insertAdjacentHTML("beforeend", `<div class="burb ${lado}"><small>${esc(quien)}</small>${esc(txt)}</div>`); }, t));
    t += 450;
  });
}
function confeti() {
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const c = document.createElement("div"); c.className = "confeti"; const col = ["#6D2835", "#BDA47B", "#D8D0C3", "#28231F", "#e7c9cf"];
  for (let k = 0; k < 90; k++) { const i = document.createElement("i"); i.style.left = Math.random() * 100 + "vw"; i.style.background = col[k % col.length];
    i.style.setProperty("--x", (Math.random() * 200 - 100) + "px"); i.style.setProperty("--r", (Math.random() * 900 - 450) + "deg");
    i.style.animationDuration = (1.8 + Math.random() * 1.6) + "s"; i.style.animationDelay = Math.random() * .4 + "s"; c.appendChild(i); }
  document.body.appendChild(c); setTimeout(() => c.remove(), 4200);
}
function pintaQuiz() {
  const Q = D.quiz, z = $("#quiz"); if (!z) return;
  const barra = `<div class="barra-q">${Q.map((_, i) => `<i class="${qRes[i] === true ? "ok" : qRes[i] === false ? "mal" : i === qI ? "ya" : ""}"></i>`).join("")}</div>`;
  if (qI >= Q.length) {
    const m = qOk === Q.length ? ["¡Perfecto!", "Te sabes el camino de memoria. Eres de las que no se pierde."] : qOk >= Q.length - 2 ? ["¡Muy bien!", "Casi perfecto. Repasa las que fallaste y quedas lista."] : ["Vamos otra vez", "Recorre el camino de arriba y vuelve a intentarlo. ¡Tú puedes!"];
    z.innerHTML = `${barra}<div class="final anima"><div class="score">${qOk}<small>/${Q.length}</small></div><h3>${m[0]}</h3><p style="color:var(--bone);max-width:520px">${m[1]}</p><button class="btn" type="button" data-quiz="otra" style="background:var(--ivory);color:var(--espresso);border-color:var(--ivory);margin-top:8px">Jugar otra vez</button></div>`;
    if (qOk === Q.length) confeti(); return;
  }
  const [sit, ops] = Q[qI];
  z.innerHTML = `${barra}<span class="eti">Situación ${qI + 1} de ${Q.length}</span><p class="sit">${esc(sit)}</p>
    <div class="opciones">${ops.map((o, j) => `<button class="opcion" type="button" data-op="${j}"><span class="l">${"ABC"[j]}</span>${esc(o)}</button>`).join("")}</div><div id="explica"></div>`;
}
document.addEventListener("click", e => {
  const pa = e.target.closest("[data-paso]"); if (pa) irA(+pa.dataset.paso);
  const mv = e.target.closest("[data-mover]"); if (mv) irA(pasoC + +mv.dataset.mover);
  const ca = e.target.closest(".carta"); if (ca) ca.classList.toggle("vuelta");
  const op = e.target.closest(".opcion");
  if (op && !op.disabled) {

    $$(".opcion").forEach((b, k) => { b.disabled = true; if (k === ok) b.classList.add("ok"); });
    if (!bien) op.classList.add("mal"); qRes[qI] = bien; if (bien) qOk++;
    $("#explica").innerHTML = `<div class="explica ${bien ? "si" : "no"}"><p><b>${bien ? "¡Exacto!" : "Casi…"}</b> ${esc(porque)}</p><button class="btn" type="button" data-quiz="sig">${qI === D.quiz.length - 1 ? "Ver resultado" : "Siguiente"} →</button></div>`;
    $$(".barra-q i")[qI].className = bien ? "ok" : "mal";
  }
  const qz = e.target.closest("[data-quiz]");
  if (qz) { if (qz.dataset.quiz === "otra") { qI = 0; qOk = 0; qRes = []; } else qI++; pintaQuiz(); }
});
document.addEventListener("keydown", e => {
  if (!$("#escena") || document.activeElement.tagName === "INPUT") return;

addEventListener("resize", () => { if ($("#escena")) { const b = $$(".parada")[pasoC]; if (b) $("#token").style.transform = `translateX(${b.offsetLeft}px)`; } });

/* ---------- rutas ---------- */
function ruta() {
  if ($("#app").hidden) return;
  const h = decodeURIComponent(location.hash.slice(1) || "inicio"), [a, b] = h.split("/");
  const html = a === "p" ? ficha(b) : a === "cirugia" ? listado("cx", b) : a === "estetica" ? listado("me", b) : a === "responder" ? responder() : a === "camino" ? camino() : a === "exterior" ? exterior() : a === "precios" ? precios() : a === "disponibilidad" ? disponibilidad() : inicio();
  $("#vista").innerHTML = html;
  if (a === "camino") { irA(0, true); pintaQuiz(); }
  const tipo = a === "p" ? (D.procs.find(x => x.slug === b) || {}).tipo : null;
  const actual = a === "p" ? (tipo === "me" ? "estetica" : "cirugia") : location.hash.slice(1) || "inicio";
  $$("#nav a").forEach(x => x.classList.toggle("activo", x.dataset.r === actual));
  $$("#nav details").forEach(x => { if (x.querySelector("summary").dataset.r === actual.split("/")[0]) x.open = true; });
  cerrarRes(); abrir(false); window.scrollTo(0, 0);
  if (pendiente !== "" && a === "p") { const d = $$("#s-faq details")[+pendiente]; if (d) { d.open = true; setTimeout(() => d.scrollIntoView({ behavior: "smooth", block: "center" }), 60); } }
  pendiente = "";
}

});

/* ---------- buscador (nombre, descripción y preguntas) ---------- */
const SIN = { botox: "toxina", lipo: "liposuccion", senos: "mamoplastia", busto: "mamoplastia", nariz: "rinoplastia", parpados: "blefaroplastia", papada: "lipopapada", abdomen: "abdominoplastia", gluteos: "glutea", cola: "glutea", rellenos: "acido hialuronico", labios: "acido hialuronico", arrugas: "toxina", orejas: "otoplastia", depilacion: "depilacion" };
const IDX = D.procs.map(p => ({ p, nom: norm(p.nombre), txt: norm([p.corto, p.cat, ...p.que_es, ...p.ideal].join(" ")), faq: p.faq.map(([q, r]) => [q, norm(q + " " + r)]) }));
let sel = -1, pendiente = "";
function cerrarRes() { $("#resultados").hidden = true; sel = -1; }
function marcar(t, q) { const i = norm(t).indexOf(q); return i < 0 ? esc(t) : esc(t.slice(0, i)) + "<mark>" + esc(t.slice(i, i + q.length)) + "</mark>" + esc(t.slice(i + q.length)); }
function buscar() {
  let q = norm($("#q").value.trim()); const caja = $("#resultados");
  if (q.length < 2) return cerrarRes();
  const alt = SIN[q] || null, out = [];
  IDX.forEach(({ p, nom, txt, faq }) => {
    const m = t => t.includes(q) || (alt && t.includes(alt));
    if (m(nom)) out.push({ p, s: 3, sub: p.corto });
    else if (m(txt)) out.push({ p, s: 2, sub: p.corto });
    const fi = faq.findIndex(([, t]) => t.includes(q));
    if (fi > -1 && q.length > 3) out.push({ p, s: 1, sub: "Pregunta: " + faq[fi][0], faq: fi });
  });
  out.sort((a, b) => b.s - a.s || (b.p.precios.length > 0) - (a.p.precios.length > 0));
  caja.innerHTML = out.length ? out.slice(0, 12).map(r => `<a class="res" href="#p/${r.p.slug}" data-f="${r.faq ?? ""}"><img src="${r.p.img}" alt=""><div><b>${marcar(r.p.nombre, q)}</b><small>${marcar(r.sub, q)}</small></div><span class="tag" ${r.p.precios.length ? 'style="background:var(--acento);color:#fff"' : ""}>${r.p.precios.length ? esc(precioCorto(r.p)) : r.p.tipo === "cx" ? "Cirugía" : "Estética"}</span></a>`).join("")
    : `<div class="sin-res">No encontramos “${esc($("#q").value)}”. Prueba con otra palabra.</div>`;
  caja.hidden = false; sel = -1;
}
$("#q").addEventListener("input", buscar);
$("#q").addEventListener("focus", () => { if ($("#q").value.trim().length > 1) buscar(); });
$("#q").addEventListener("keydown", e => {
  const items = $$("#resultados .res"); if (!items.length) return;
  if (e.key === "ArrowDown" || e.key === "ArrowUp") { e.preventDefault(); sel = (sel + (e.key === "ArrowDown" ? 1 : -1) + items.length) % items.length; items.forEach((x, i) => x.classList.toggle("sel", i === sel)); items[sel].scrollIntoView({ block: "nearest" }); }
  if (e.key === "Enter") { e.preventDefault(); (items[sel] || items[0]).click(); $("#q").value = ""; $("#q").blur(); }
});
document.addEventListener("click", e => { if (!e.target.closest(".buscador")) cerrarRes(); else if (e.target.closest(".res")) { pendiente = e.target.closest(".res").dataset.f; $("#q").value = ""; if (location.hash === e.target.closest(".res").getAttribute("href")) ruta(); } });
document.addEventListener("keydown", e => {
  if (e.key === "/" && document.activeElement.tagName !== "INPUT" && !$("#app").hidden) { e.preventDefault(); $("#q").focus(); }
  if (e.key === "Escape") { cerrarRes(); abrir(false); }
});
